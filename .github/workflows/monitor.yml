name: Scurfa Watch Monitor

on:
  schedule:
    # GitHub's internal timer (best effort every 5 mins)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # This allows Google Apps Script to "poke" the repo every minute

jobs:
  check-stock:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scurfa Tracker
        # This part connects your GitHub Secrets to the Python script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_scurfa.py
